spring.application.name=kredoshop-be
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kredo_studio?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

jwt.password.reset.secret=${JWT_RESET_SECRET}
jwt.password.reset.expiration=900000
jwt.signer.key=${JWT_SIGNER_KEY}

#API Key AI...
gemini.api.key=${GEMINI_API_KEY}

#Sepay thanh toan
sepay.api-key=${SEPAY_API_KEY}
sepay.webhook-token=${SEPAY_WEBHOOK_TOKEN}

# Allowed frontend origin(s) for CORS, comma-separated
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
